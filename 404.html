@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#070708;color:#f4f4f8;font-family:Manrope,Arial,sans-serif;
  display:grid;place-items:center;padding:32px 22px;overflow-x:hidden}
.wrap{position:relative;z-index:1;text-align:center;max-width:470px;animation:up .7s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.mark{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px}
.mark img{width:58px;height:58px}
.mark b{font-family:Sora,Manrope,Arial,sans-serif;font-size:31px;font-weight:700;letter-spacing:-1.4px}
.gold{background-image:linear-gradient(104deg,#d99a2e 0%,#f0b13c 26%,#ffd070 44%,#d99a2e 62%,#f0b13c 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.mark small{font-size:14px;color:#b9b9c4;font-weight:700}
.code{font-family:Sora,Manrope,Arial,sans-serif;font-size:96px;font-weight:700;letter-spacing:-5px;line-height:1;margin:0}
h1{font-family:Sora,Manrope,Arial,sans-serif;font-size:25px;font-weight:600;letter-spacing:-.8px;margin:16px 0 12px}
p{font-size:13.5px;line-height:1.8;color:#c3c3ce;margin:0 0 30px}
.acts{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
a.btn{text-decoration:none;min-height:46px;display:inline-flex;align-items:center;padding:0 22px;border-radius:12px;
  font-size:13px;font-weight:700;transition:transform .2s,box-shadow .2s}
a.home{background:linear-gradient(118deg,#f3c063 0%,#e3a638 40%,#c98a26 68%,#eab551 100%);color:#18120a;
  border:1px solid #ffdf9055;box-shadow:0 8px 26px rgba(224,164,55,.18)}
a.next{background:rgba(255,255,255,.03);color:#ededf3;border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
a.btn:hover{transform:translateY(-2px)}
.robot{width:132px;margin:0 auto 6px;display:block;animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.say{display:inline-block;margin-bottom:22px;padding:9px 15px;border-radius:16px 16px 16px 4px;
  background:linear-gradient(115deg,#f8d77c,#e6ad39);color:#20160a;font-size:12.5px;font-weight:700}
@media(max-width:480px){.code{font-size:74px}.robot{width:104px}}
@media(prefers-reduced-motion:reduce){.wrap,.robot{animation:none}}
.ali-bg .bg-dust,.ali-bg .bg-dust2,.ali-bg .bg-dust3,.ali-bg .bg-dust4,.ali-bg .bg-dust5,.ali-bg .bg-dust6{display:none!important}

/* Sahifalar orasida silliq o'tish */
@view-transition{navigation:auto}
